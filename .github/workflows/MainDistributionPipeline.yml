#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

# The event name is part of the key on purpose: a manual dispatch (the only way the
# duckdb-main canary runs) and the push run for the SAME sha used to share a group,
# so dispatching the canary cancelled the shippable v1.5 build while it was still
# queued -- the stable matrix then had no verdict at all on that commit, and the
# cancellations read as failures. Found by the duckeye session, 2026-09-05.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  # Canary against DuckDB main (the v2.0 line). This extension SHIPS against the
  # pinned v1.5 stable below -- this job exists only to prove the source still
  # COMPILES against v2.0, because duckdb/community-extensions builds every
  # release PR against `v2.0-cyanoptera` via build_next.yml and there is no
  # per-extension opt-out.
  #
  # Runs on pushes to MAIN and on demand -- not unconditionally: a push and a
  # pull_request both fire on the same commit and a PR's check rollup includes
  # both, so an unrestricted canary would show red on every PR while v2.0
  # support is in progress. `if:` rather than `continue-on-error:` because a job
  # calling a REUSABLE workflow accepts only a fixed set of keys -- adding
  # continue-on-error makes the whole workflow fail to parse and schedules zero
  # jobs. Drive it with:
  #   gh workflow run MainDistributionPipeline.yml --ref <branch>
  duckdb-next-build:
    name: Build extension binaries (duckdb 2.0 canary)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    with:
      # The 2.0 RELEASE branch, not `main`: one canary line for the whole fleet
      # (Teague's rule, 2026-09-13), and the branch 2.0.0 will be cut from.
      duckdb_version: v2.0-cyanoptera
      ci_tools_version: main
      extension_name: duck_block_utils

  # Shippable build. The submodules are pinned at the v1.5-variegata branch tip
  # (see .gitmodules), but the extension is BUILT against the v1.5.5 release tag
  # so the produced binary is a proper release (loadable by released DuckDB),
  # not a `-dev` build.
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5-variegata
      extension_name: duck_block_utils
      # Windows re-excluded: the windows_amd64 (vs2019comp) leg compiles the
      # extension + unittest (460/460) but the test runner fails to launch
      # (`make: *** test_release_internal Error 127` — loader/toolchain issue,
      # not a source regression; same source is green on every other leg).
      # Windows was not shipped historically; this restores that status quo.
      exclude_archs: 'windows_amd64;windows_amd64_mingw'

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5-variegata
      extension_name: duck_block_utils
      format_checks: 'format;tidy'

  # The vocabulary header is a PUBLISHED INTERFACE that four sibling extensions
  # vendor as a single copied file. Its freestanding-ness is a promise to them,
  # and until now nothing enforced it anywhere -- the check existed but ran only
  # when someone typed it.
  #
  # Deliberately checks out WITHOUT submodules: needing none is precisely the
  # claim under test, so the job would be weaker if it had them available.
  # STRICT=1 so a missing compiler fails rather than skipping green.
  # THE PIN EQUALS THE SHIPPED TAG. Fleet rule (Teague, 2026-09-13): the duckdb
  # submodule is pinned at exactly the commit of the tag the stable build ships
  # against, which is also the version the community registry builds every
  # extension with. Otherwise local builds and each repo's own CI artifacts carry a
  # different DuckDB than the served one, and extensions built in different repos
  # cannot co-load locally (the ABI is exact-version). Measured 2026-09-13: five
  # sibling repos were on a July dev commit, one on a v1.5.6-dev commit, one on
  # DuckDB main. Nothing but a check keeps this true. The second assertion keeps
  # this job's constant from drifting away from the `duckdb_version:` the build
  # jobs above actually use.
  duckdb-pin:
    name: DuckDB submodule pin equals the shipped tag
    runs-on: ubuntu-latest
    env:
      DUCKDB_VERSION: v1.5.5
    steps:
      - uses: actions/checkout@v4
      - name: Compare the submodule pin with the tag's commit
        run: |
          set -eu
          want=$(git ls-remote --tags https://github.com/duckdb/duckdb "refs/tags/${DUCKDB_VERSION}^{}" | cut -f1)
          [ -n "$want" ] || want=$(git ls-remote --tags https://github.com/duckdb/duckdb "refs/tags/${DUCKDB_VERSION}" | cut -f1)
          have=$(git ls-tree HEAD duckdb | awk '{print $3}')
          echo "shipped tag ${DUCKDB_VERSION} -> ${want}"
          echo "submodule pin          -> ${have}"
          [ -n "$want" ] || { echo "::error::could not resolve tag ${DUCKDB_VERSION} upstream"; exit 1; }
          [ "$want" = "$have" ] || { echo "::error::duckdb submodule pin ${have} is not the ${DUCKDB_VERSION} tag ${want}; run: git -C duckdb fetch --tags && git -C duckdb checkout ${DUCKDB_VERSION}"; exit 1; }
          n=$(grep -c "duckdb_version: ${DUCKDB_VERSION}$" .github/workflows/MainDistributionPipeline.yml)
          [ "$n" -ge 1 ] || { echo "::error::no build job in this workflow ships duckdb_version: ${DUCKDB_VERSION}; this job's constant has drifted"; exit 1; }
          echo "OK: pin equals ${DUCKDB_VERSION}, and ${n} build job(s) ship it"

  vocabulary-header:
    name: Vocabulary header is freestanding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Header must compile and link with no DuckDB present
        env:
          DUCK_BLOCK_CHECKS_STRICT: '1'
        run: python3 test/check_vocabulary_header.py
