#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  # Pushes build only on main. A push to a PR branch fires a push run AND a
  # pull_request run for the same commit, so every ungated job here built twice
  # per push: 13 duplicate jobs, 2 of them hosted macOS legs, measured on
  # adc33aa3 (push run 39142811640 and pull_request run 39142815628, same sha).
  # The pull_request run is the one whose status matters. What the filter costs:
  # a branch with no PR open gets no CI until the PR opens. Nothing here deploys
  # on tags, and workflow_dispatch still runs on any branch.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The event name is part of the key on purpose: a manual dispatch (the only way the
# duckdb-main canary runs) and the push run for the SAME sha used to share a group,
# so dispatching the canary cancelled the shippable v1.5 build while it was still
# queued -- the stable matrix then had no verdict at all on that commit, and the
# cancellations read as failures. Found by the duckeye session, 2026-09-05.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  # THE NEXT LINE, first-class. duckdb/community-extensions builds every descriptor
  # that carries ref_next against `v2.0-cyanoptera` (build_next.yml), so a PR is not
  # green here until it builds and tests there too. This was the canary until
  # 2026-09-13; Teague's dual-line ruling removed its gate.
  #
  # AFTER THE PROMOTE this leg moves ONE STEP PAST the shipping line. v2.0.0 is now
  # duckdb-stable-build below, so a next leg carrying v2.0.0 would be an exact
  # duplicate of it -- same ref, same commit, same tests, twice the runner time and
  # no new signal. This leg therefore tracks the v2.0-cyanoptera BRANCH TIP, pinned
  # as an explicit STAGED VERSION + COMMIT pair (DUCKDB_NEXT / DUCKDB_NEXT_COMMIT in
  # duckdb-pin below; same form as duck_tails f0a4d40 and duckdb_mcp #109).
  #
  # MATRIX WIDTH: the reusable workflow's reduced_ci_mode defaults to `auto`, which
  # builds three arches on pull requests (linux_amd64, windows_amd64, wasm_eh) and
  # the full matrix on pushes to main and on dispatch (markdown, measured
  # 2026-09-13). Kept on purpose: releases are cut from main after the push run, so
  # an arm64/macOS 2.0 break still surfaces before any descriptor PR. To build the
  # full matrix on PRs too, add `reduced_ci_mode: disabled` below; exclude_archs
  # can only narrow a matrix, never widen one.
  #
  # ONCE PER PR, ONCE PER MERGE. A push to a PR branch fires a push run AND a
  # pull_request run for the same commit, so an ungated job here builds twice per
  # push (markdown, measured on 126739d). This gate runs it on every pull request,
  # on merges to main, and on dispatch; the one case it does not cover is a branch
  # with no PR open, which gets its first next-line build when the PR opens.
  duckdb-next-build:
    name: Build extension binaries (DuckDB next, v2.0-cyanoptera)
    # A STAGED VERSION PLUS AN EXPLICIT COMMIT, never the branch name. ci_phase.py
    # (duckdb/extension-ci-tools, scripts/ci_phase.py:408-411 at
    # 2de802913caf5c9bba0ef267658b20f3cc0486c3) checks duckdb_version against a
    # semver pattern; the branch name `v2.0-cyanoptera` fails it, so the script
    # resolves the branch's staged version for the download URL ONLY and never
    # writes it back to DUCKDB_VERSION. CMake then stamps the extension
    # `v2.0-cyanoptera` while the library it links reports the staged version;
    # DuckDB refuses to load a stamp that differs from its own version, so every
    # test fails at its `require` line (measured on three sibling repos, all
    # 2026-10-25). A staged version like v2.0.1-alpha50125 matches ci-tools'
    # STAGED_DUCKDB_VERSION_PATTERN and is used as given, and duckdb_commit selects
    # the checkout. Bump the pair together when the branch tip moves: the version is
    # the commit's https://duckdb-staging.duckdb.org/<commit[:10]>/latest_alpha_version.txt
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    with:
      # The DUCKDB_NEXT / DUCKDB_NEXT_COMMIT pair from duckdb-pin; bump them together.
      duckdb_version: v2.0.1-alpha50125
      duckdb_commit: bb5bdadda4ee51d39b359fe8f4d1960973191175
      ci_tools_version: main
      extension_name: duck_block_utils
      # Make a skipped test run FAIL on this leg. `T` is the test pattern ci-tools
      # passes to run_tests.py (`T ?=` in duckdb_extension.Makefile, so an env var
      # wins), and test_env_variables is handed to `make test_release` by
      # ci_phase.py. `--require duck_block_utils` turns "could not load" into
      # `require duck_block_utils: FAILED` instead of a silent skip.
      # Verified against b15358c371d on ci-tools main:
      #   extension present -> exit 0, "16 passed, 2 skipped"
      #   extension hidden  -> exit 2, "0 passed, 18 failed, 0 skipped"
      # READ THAT COUNT in this leg's log -- a green Test step over
      # "0 passed, N skipped" is the failure this configuration exists to
      # eliminate, not a pass.
      # This leg and duckdb-stable-build only: ci-tools v1.5-variegata has no
      # TEST_RUNNER and no `T`, so the same variable on duckdb-variegata-build
      # would be silently ignored -- see `make test-require` for the portable form.
      test_config: '{"test_env_variables": {"T": "--test-flags \"--require duck_block_utils\" \"test/*\""}}'

  # ADVISORY canary on DuckDB main, the line beyond 2.0. Pushes to main and on
  # demand only: a push and a pull_request both fire on the same commit and a PR's
  # rollup includes both, so an unconditional job here would redden every PR for a
  # line nobody ships. `if:` rather than `continue-on-error:` because a job calling
  # a REUSABLE workflow accepts only a fixed set of keys.
  #   gh workflow run MainDistributionPipeline.yml --ref <branch>
  duckdb-main-canary:
    name: Build extension binaries (duckdb main canary)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    with:
      duckdb_version: main
      ci_tools_version: main
      extension_name: duck_block_utils

  # THE SHIPPING LINE, now v2.0.0. The same commit, version and ci-tools branch as
  # community-extensions' build.yml builds every descriptor with by default, so what
  # this repo ships is what the registry serves. Artifacts are named from
  # duckdb_version, so they land as `duck_block_utils-v2.0.0-extension-<arch>`.
  # Since duckdb/community-extensions#3086 closed (2026-10-20) this leg runs the
  # tests itself; READ ITS `ran tests:` COUNT, not the check colour.
  #
  # WINDOWS IS NO LONGER EXCLUDED HERE. The exclusion below moved to
  # duckdb-variegata-build, where the Error 127 it describes was measured: that is a
  # v1.5-variegata test-runner launch failure, not a source defect. On the 2.0 line
  # windows_amd64 was measured green on this repo at 8744e64
  # ("ran tests: 18 passed, 0 skipped"), so re-excluding it here would hide a line
  # that works. windows_amd64_mingw has no measurement on the 2.0 line yet.
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      # v2.0.0 is semver-shaped, so ci_phase.py does not override it, and
      # duckdb_commit selects the checkout. A branch name here would break every
      # `require duck_block_utils` -- see the note on duckdb-next-build above.
      duckdb_version: v2.0.0
      duckdb_commit: d54cbbe3df17e8e5ce68312f483b4155836112aa
      ci_tools_version: v2.0-cyanoptera
      extension_name: duck_block_utils
      # REQUIRED on the shipping leg. Without it an extension that fails to load
      # yields "ran tests: 0 passed, N skipped" and this job reports SUCCESS --
      # measured on duckdb_webbed's unguarded main canary (0 passed, 130 skipped,
      # conclusion success, 2026-10-25). The token is the literal on this repo's own
      # test/ `require` lines, measured with:
      #   grep -rhoE '^require [a-z_]+' test/ | sort -u
      test_config: '{"test_env_variables": {"T": "--test-flags \"--require duck_block_utils\" \"test/*\""}}'

  # THE v1.5 VARIANT the registry still builds (scripts/build.py routes v1.5.6 to
  # each descriptor's variegata ref). This was the shipping leg before the promote;
  # it stays gating because v1.5.6 users are the bulk of current installs. The
  # reusable workflow repoints DuckDB itself (`DUCKDB_GIT_VERSION=... make
  # set_duckdb_version`), so this job builds the v1.5.6 RELEASE TAG even though the
  # submodule gitlink is now the v2.0.0 commit -- a branch-tip build would produce a
  # `-dev` extension that no released CLI can load.
  duckdb-variegata-build:
    name: Build extension binaries (DuckDB v1.5 variant)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.6
      # extension-ci-tools has no v1.5.6 tag; v1.5-variegata tracks the v1.5.x line.
      # This pins the CI TOOLING, not DuckDB.
      ci_tools_version: v1.5-variegata
      extension_name: duck_block_utils
      # Windows excluded on THIS line only (moved here from the old v1.5.6 stable
      # leg): the windows_amd64 (vs2019comp) leg compiles the extension + unittest
      # (460/460) but the test runner fails to launch
      # (`make: *** test_release_internal Error 127` — loader/toolchain issue,
      # not a source regression; same source is green on every other leg).
      # Windows was not shipped on the v1.5 line historically.
      exclude_archs: 'windows_amd64;windows_amd64_mingw'
      # NO test_config. `T ?=` is absent from duckdb_extension.Makefile on
      # v1.5-variegata, so test_env_variables is silently ignored here; use
      # `make test-require` locally for this line instead.

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v2.0-cyanoptera
    with:
      duckdb_version: v2.0.0
      ci_tools_version: v2.0-cyanoptera
      extension_name: duck_block_utils
      format_checks: 'format;tidy'

  # THE PIN EQUALS THE REGISTRY DEFAULT COMMIT, AND THE WORKFLOW SHIPS THE DEFAULT
  # AND THE VARIANT. Fleet rule (Teague, 2026-09-13): the duckdb submodule is
  # pinned at exactly the commit the community registry builds every extension
  # with by default (build.yml's duckdb_commit, built as its duckdb_version),
  # and this workflow also ships the v1.5 variant the registry still builds
  # (scripts/build.py's variegata route). Otherwise local builds and each repo's
  # own CI artifacts carry a different DuckDB than the served one, and extensions
  # built in different repos cannot co-load locally (the ABI is exact-version).
  # Measured 2026-09-13: five sibling repos were on a July dev commit, one on a
  # v1.5.6-dev commit, one on DuckDB main. Nothing but a check keeps this true.
  # The greps keep this job's constants from drifting away from the
  # `duckdb_commit:` / `duckdb_version:` / `ci_tools_version:` the build jobs below
  # actually use.
  duckdb-pin:
    name: DuckDB submodule pin equals the shipped tag
    # Name kept as-is even though the rule is now "pin equals the registry default":
    # required-check configuration may key on this job name.
    runs-on: ubuntu-latest
    env:
      DUCKDB_COMMIT: d54cbbe3df17e8e5ce68312f483b4155836112aa
      # The version the build reports, passed as duckdb_version while duckdb_commit
      # selects the checkout. It must be a short release-shaped string: the
      # extension's metadata stamps at most 32 bytes of it, and DuckDB refuses to
      # load a file whose stamp differs from its own version, so a bare 40-char
      # commit as duckdb_version makes every `require duck_block_utils` fail
      # (duckdb/community-extensions#3086).
      DUCKDB_VERSION: v2.0.0
      DUCKDB_CI_TOOLS: v2.0-cyanoptera
      DUCKDB_VARIANT: v1.5.6
      # The next line duckdb-next-build tests: the v2.0-cyanoptera tip, pinned as an
      # explicit STAGED VERSION + COMMIT pair (Teague, 2026-10-25; same form as
      # duckdb_mcp #109). Not the branch name: ci-tools' prebuilt path (ci_phase.py)
      # resolves a non-semver duckdb_version to the tip's staged version for the
      # download only and never writes it back, so the extension's stamp and the
      # linked library disagree and no test can load it. A staged version matches
      # ci-tools' STAGED_DUCKDB_VERSION_PATTERN and is used as given. Bump both
      # together when the tip moves: the version is the commit's
      # https://duckdb-staging.duckdb.org/<commit[:10]>/latest_alpha_version.txt
      DUCKDB_NEXT: v2.0.1-alpha50125
      DUCKDB_NEXT_COMMIT: bb5bdadda4ee51d39b359fe8f4d1960973191175
      # Flip day (spec §3 step 3) keeps a duckdb-legacy-build at the outgoing version
      # for one release; set this to that version then so the stray-literal scan below
      # exempts it instead of flagging it. Empty the rest of the time.
      #
      # EMPTY at this repo's promote: the version leaving the shipping slot is
      # v1.5.6, which is not leaving the workflow -- it becomes DUCKDB_VARIANT
      # above, built by duckdb-variegata-build and already exempt from the scan
      # and pinned by the drift loop. So there is no legacy job to exempt.
      DUCKDB_LEGACY: ''
    steps:
      - uses: actions/checkout@v4
      - name: Compare the submodule pin with the registry default commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # One variable, one edit point: every sibling repo copies this job
          # verbatim, and the greps and the stray-literal scans below all read
          # this same file.
          wf=.github/workflows/MainDistributionPipeline.yml
          # The pin is compared with the commit directly rather than resolved
          # through ls-remote, so a moved tag cannot hide a stale pin.
          have=$(git ls-tree HEAD duckdb | awk '{print $3}')
          echo "registry default commit -> ${DUCKDB_COMMIT} (${DUCKDB_VERSION})"
          echo "submodule pin           -> ${have}"
          [ "$DUCKDB_COMMIT" = "$have" ] || { echo "::error::duckdb submodule pin ${have} is not the registry default commit ${DUCKDB_COMMIT}; run: git -C duckdb fetch origin ${DUCKDB_CI_TOOLS} && git -C duckdb checkout ${DUCKDB_COMMIT}"; exit 1; }
          for want in "duckdb_commit: ${DUCKDB_COMMIT}" "duckdb_version: ${DUCKDB_VERSION}" "ci_tools_version: ${DUCKDB_CI_TOOLS}" "duckdb_version: ${DUCKDB_VARIANT}" "duckdb_version: ${DUCKDB_NEXT}" "duckdb_commit: ${DUCKDB_NEXT_COMMIT}"; do
            c=$(grep -c "${want}$" "$wf" || true)
            [ "$c" -ge 1 ] || { echo "::error::no build job in this workflow uses ${want}; this job's constants have drifted"; exit 1; }
          done
          # NO OTHER DuckDB VERSION may drift from the shipped ones anywhere else in
          # this file: sibling workflows (yaml, mcp) embed a version in artifact NAMES
          # and CLI download URLs (e.g. `yaml-v1.5.4-extension-wasm_*`,
          # `releases/download/v1.5.4/duckdb_cli`) that the greps above cannot see, so
          # a bump left them stale and this job went green over a red build. Comment
          # lines (first non-space char `#`) are exempt, and so are `uses:` lines (a
          # `- uses:` list item too): a third-party action pin like `@v2.0.4` is not a
          # DuckDB version. Branch names like `v2.0-cyanoptera` and `v1.5-variegata`
          # have no third numeric component and so never match this pattern. The
          # optional pre-release suffix makes a `v2.0.0-alpha1`-style tag match whole, while
          # `v1.5.6-extension-wasm_eh` in an artifact name still reads as `v1.5.6`.
          # DUCKDB_LEGACY, when set (flip day, see above), is exempt too.
          ver_re='v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc|dev)[0-9.]*)?'
          bad=0
          while IFS=: read -r lineno line; do
            printf '%s\n' "$line" | grep -qE '^[[:space:]]*#' && continue
            printf '%s\n' "$line" | grep -qE '^[[:space:]]*-?[[:space:]]*uses:' && continue
            for v in $(printf '%s\n' "$line" | grep -oE "$ver_re" || true); do
              [ "$v" = "$DUCKDB_VERSION" ] && continue
              [ "$v" = "$DUCKDB_VARIANT" ] && continue
              [ "$v" = "$DUCKDB_NEXT" ] && continue
              [ -n "$DUCKDB_LEGACY" ] && [ "$v" = "$DUCKDB_LEGACY" ] && continue
              echo "::error::line ${lineno}: ${line} -- a DuckDB version literal that is not the shipped ${DUCKDB_VERSION} or ${DUCKDB_VARIANT}: derive it from the shipped version or bump it"
              bad=1
            done
          done < <(grep -nE "$ver_re" "$wf" || true)
          # The commit appears in duckdb_commit: inputs, which the version scan above
          # cannot see, so a commit bump could leave a stale sha behind. Any 40-hex
          # literal outside comments, `uses:` pins and `vcpkg_commit:` must be it.
          while IFS=: read -r lineno line; do
            printf '%s\n' "$line" | grep -qE '^[[:space:]]*#' && continue
            printf '%s\n' "$line" | grep -qE '^[[:space:]]*-?[[:space:]]*uses:' && continue
            printf '%s\n' "$line" | grep -qE '^[[:space:]]*vcpkg_commit:' && continue
            for h in $(printf '%s\n' "$line" | grep -oE '[0-9a-f]{40}' || true); do
              [ "$h" = "$DUCKDB_COMMIT" ] && continue
              [ "$h" = "$DUCKDB_NEXT_COMMIT" ] && continue
              echo "::error::line ${lineno}: ${line} -- a commit literal that is not the registry default ${DUCKDB_COMMIT}: derive it from the pinned commit or bump it"
              bad=1
            done
          done < <(grep -nE '[0-9a-f]{40}' "$wf" || true)
          [ "$bad" -eq 0 ] || exit 1
          # THE AUTHORITY is the registry's own files, not this job's constants: a
          # constant checked only against itself passes for a year after the registry
          # moves (panduck, 2026-09-13). Resolve main to a sha first so the raw fetches
          # are not served from the branch cache. THREE degraded paths, deliberately
          # different: UNREACHABLE (curl itself failed, HTTP code 000) is the world
          # being unavailable -> a NOTE, and the summary says the registry assertions
          # were not made, with only the local-constant assertions above run; a
          # non-2xx HTTP code (e.g. a renamed/removed registry file) is this check
          # asking the world a well-formed question and getting told no -> a FAILURE
          # naming the code and URL (a bare `curl -sf` would have mistaken this for
          # UNREACHABLE and measured nothing); REACHABLE, 2xx, BUT UNPARSEABLE is this
          # check being wrong about the file's content -> also a FAILURE.
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          base="https://raw.githubusercontent.com/duckdb/community-extensions"
          # An Authorization: Bearer header with an EMPTY token is not "no header": GitHub
          # answers 401 to it, worse than sending no header at all (confirmed empirically).
          # An unauthenticated local run (no GITHUB_TOKEN, which the docs tell maintainers
          # to run) would then always miss sha resolution and fall back to the `main` REF
          # NAME, comparing against whatever the branch URL's cache happens to be serving --
          # the exact staleness this sha-resolution step exists to avoid. So the header is
          # added only when a token is actually present; CI always has one.
          auth=(); [ -n "${GITHUB_TOKEN:-}" ] && auth=(-H "Authorization: Bearer ${GITHUB_TOKEN}")
          sha=$(curl -sf "${auth[@]}" https://api.github.com/repos/duckdb/community-extensions/commits/main | grep -m1 -o '"sha": *"[0-9a-f]*"' | grep -o '[0-9a-f]\{40\}' || true)
          url1="${base}/${sha:-main}/.github/workflows/build.yml"
          url2="${base}/${sha:-main}/scripts/build.py"
          f1=$(mktemp); f2=$(mktemp)
          # curl itself writes 000 to -w's %{http_code} when no HTTP response was
          # received at all (DNS failure, connection refused, timeout); `|| echo 000`
          # would DOUBLE that to "000000" (curl's own "000" plus the fallback's),
          # which then fails the equality check below and misreads UNREACHABLE as a
          # non-2xx code. `|| true` only stops `set -e` from killing the script on
          # curl's nonzero exit; the "000" already captured is curl's, unaltered.
          code1=$(curl -s -o "$f1" -w '%{http_code}' "$url1" || true)
          code2=$(curl -s -o "$f2" -w '%{http_code}' "$url2" || true)
          if [ "$code1" = "000" ] || [ "$code2" = "000" ]; then
            echo "::notice::could not reach the community registry; the pin was checked against the local constants only"
            mode="NOT checked against the registry (unreachable); local constants ${DUCKDB_COMMIT:0:10}/${DUCKDB_VERSION}/${DUCKDB_CI_TOOLS}/${DUCKDB_VARIANT} only"
          elif [ "${code1#2}" = "$code1" ]; then
            echo "::error::community registry returned HTTP ${code1} for ${url1}"
            echo "duckdb-pin: FAILED, registry returned ${code1} for ${url1}" >> "$summary"; exit 1
          elif [ "${code2#2}" = "$code2" ]; then
            echo "::error::community registry returned HTTP ${code2} for ${url2}"
            echo "duckdb-pin: FAILED, registry returned ${code2} for ${url2}" >> "$summary"; exit 1
          else
            # Commented-out lines are dropped first: build.yml keeps a disabled
            # `# duckdb_tag:` line, and parsing it would report a tag nothing builds.
            grep -v '^[[:space:]]*#' "$f1" > "$f1.live" || true
            reg_commit=$(grep -m1 -o "inputs.duckdb_commit || (inputs.duckdb_version == '' && '[0-9a-f]\{40\}'" "$f1.live" | grep -o '[0-9a-f]\{40\}' || true)
            reg_version=$(grep -m1 -oE "^[[:space:]]+duckdb_version: \\$\\{\\{ inputs.duckdb_version \\|\\| 'v[^']*'" "$f1.live" | grep -o "'v[^']*'" | tr -d "'" || true)
            reg_tools=$(grep -m1 -o "inputs.ci_tools_version || '[^']*'" "$f1.live" | grep -o "'[^']*'$" | tr -d "'" || true)
            # build.py routes one DUCKDB_VERSION to each descriptor's `variegata` ref;
            # the version sits in the condition on the line before.
            reg_variant=$(grep -B1 "'variegata' in desc" "$f2" | grep -m1 -o "== 'v[0-9.]*'" | grep -o "v[0-9.]*" || true)
            if [ -z "$reg_commit" ] || [ -z "$reg_version" ] || [ -z "$reg_tools" ] || [ -z "$reg_variant" ]; then
              echo "::error::community-extensions at ${sha:-main} was fetched but build.yml/build.py carry no recognisable default (commit='${reg_commit}', version='${reg_version}', ci-tools='${reg_tools}', variant='${reg_variant}'); this check's parse is wrong about the registry, fix the check"
              echo "duckdb-pin: FAILED, registry files fetched but unparseable" >> "$summary"; exit 1
            fi
            registry="${reg_commit}/${reg_version}/${reg_tools}/${reg_variant}"
            repo="${DUCKDB_COMMIT}/${DUCKDB_VERSION}/${DUCKDB_CI_TOOLS}/${DUCKDB_VARIANT}"
            if [ "$registry" != "$repo" ]; then
              echo "::error::the community registry builds commit/version/ci-tools/variant ${registry} (at ${sha:-main}) but this repo ships ${repo}; update the pin, the constants and the build jobs to the registry's lines"
              echo "duckdb-pin: FAILED, registry ${registry} vs repo ${repo}" >> "$summary"; exit 1
            fi
            mode="checked against the registry (default ${reg_commit:0:10} ${reg_version} on ${reg_tools}, variant ${reg_variant}, at ${sha:-main})"
          fi
          echo "duckdb-pin: OK, pin ${have:0:10} == ${DUCKDB_COMMIT:0:10} (${DUCKDB_VERSION}); jobs ship it and ${DUCKDB_VARIANT}; ${mode}" | tee -a "$summary"

  vocabulary-header:
    name: Vocabulary header is freestanding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Header must compile and link with no DuckDB present
        env:
          DUCK_BLOCK_CHECKS_STRICT: '1'
        run: python3 test/check_vocabulary_header.py

  # THE HEADER AND THE CONFORMANCE MACROS ARE TWO ENCODINGS OF ONE VOCABULARY, and
  # until now nothing in CI compared them. They disagreed for three releases:
  # TYPE_DOCUMENT landed in the header with the 1.4 amendment of 2026-09-16 and was
  # never added to duck_block_declared_types(), so a producer emitting the document
  # root the spec had just legalised was reported as using an undeclared name. A
  # CONSUMER found it (duckdb_markdown, while re-vendoring), which is the wrong way
  # round for a defect in two files that both live here.
  #
  # check_conformance_macro.py is the better comparison -- it runs the real extension
  # against the real macros, so it sees RULE divergence and not just missing names --
  # but it needs a built extension and is one of the guards #58 reports as unrun. This
  # one needs no build, no network and no DuckDB: two text files and a set comparison.
  # There is no reason for it not to run on every push, which is the whole argument.
  #
  # BOTH ANSWERS PINNED before wiring it: --self-test mutates the pair in memory three
  # ways (a dropped name, an invented name, a truncated scrape) and requires all three
  # to be detected; and the guard was run against the PRE-FIX macros, where it reports
  # the real historical 'document' gap and exits 1. A detector exercised only on the
  # passing side is half-checked.
  conformance-types:
    name: Header and conformance macros declare the same names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: The guard can fail
        run: python3 test/check_conformance_types.py --self-test
      - name: Header and macros agree
        run: python3 test/check_conformance_types.py
