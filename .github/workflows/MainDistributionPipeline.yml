#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

# The event name is part of the key on purpose: a manual dispatch (the only way the
# duckdb-main canary runs) and the push run for the SAME sha used to share a group,
# so dispatching the canary cancelled the shippable v1.5 build while it was still
# queued -- the stable matrix then had no verdict at all on that commit, and the
# cancellations read as failures. Found by the duckeye session, 2026-09-05.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  # THE NEXT LINE, first-class. duckdb/community-extensions builds every descriptor
  # that carries ref_next against `v2.0-cyanoptera` (build_next.yml), so a PR is not
  # green here until it builds and tests there too. This was the canary until
  # 2026-09-13; Teague's dual-line ruling removed its gate.
  #
  # MATRIX WIDTH: the reusable workflow's reduced_ci_mode defaults to `auto`, which
  # builds three arches on pull requests (linux_amd64, windows_amd64, wasm_eh) and
  # the full matrix on pushes to main and on dispatch (markdown, measured
  # 2026-09-13). Kept on purpose: releases are cut from main after the push run, so
  # an arm64/macOS 2.0 break still surfaces before any descriptor PR. To build the
  # full matrix on PRs too, add `reduced_ci_mode: disabled` below; exclude_archs
  # can only narrow a matrix, never widen one.
  #
  # ONCE PER PR, ONCE PER MERGE. A push to a PR branch fires a push run AND a
  # pull_request run for the same commit, so an ungated job here builds twice per
  # push (markdown, measured on 126739d). This gate runs it on every pull request,
  # on merges to main, and on dispatch; the one case it does not cover is a branch
  # with no PR open, which gets its first next-line build when the PR opens.
  duckdb-next-build:
    name: Build extension binaries (duckdb next, v2.0 line)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    with:
      duckdb_version: v2.0-cyanoptera
      ci_tools_version: main
      extension_name: duck_block_utils
      # Make a skipped test run FAIL on this leg. `T` is the test pattern ci-tools
      # passes to run_tests.py (`T ?=` in duckdb_extension.Makefile, so an env var
      # wins), and test_env_variables is handed to `make test_release` by
      # ci_phase.py. `--require duck_block_utils` turns "could not load" into
      # `require duck_block_utils: FAILED` instead of a silent skip.
      # Verified on this leg's ci-tools (main) against b15358c371d:
      #   extension present -> exit 0, "16 passed, 2 skipped"
      #   extension hidden  -> exit 2, "0 passed, 18 failed, 0 skipped"
      # Only this leg: ci-tools v1.5-variegata has no TEST_RUNNER and no `T`, so the
      # same variable there is silently ignored -- see `make test-require` for the
      # portable form.
      test_config: '{"test_env_variables": {"T": "--test-flags \"--require duck_block_utils\" \"test/*\""}}'

  # ADVISORY canary on DuckDB main, the line beyond 2.0. Pushes to main and on
  # demand only: a push and a pull_request both fire on the same commit and a PR's
  # rollup includes both, so an unconditional job here would redden every PR for a
  # line nobody ships. `if:` rather than `continue-on-error:` because a job calling
  # a REUSABLE workflow accepts only a fixed set of keys.
  #   gh workflow run MainDistributionPipeline.yml --ref <branch>
  duckdb-main-canary:
    name: Build extension binaries (duckdb main canary)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    with:
      duckdb_version: main
      ci_tools_version: main
      extension_name: duck_block_utils

  # Shippable build. The submodules are pinned at the v1.5-variegata branch tip
  # (see .gitmodules), but the extension is BUILT against the v1.5.6 release tag
  # so the produced binary is a proper release (loadable by released DuckDB),
  # not a `-dev` build.
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.6
      ci_tools_version: v1.5-variegata
      extension_name: duck_block_utils
      # Windows re-excluded: the windows_amd64 (vs2019comp) leg compiles the
      # extension + unittest (460/460) but the test runner fails to launch
      # (`make: *** test_release_internal Error 127` — loader/toolchain issue,
      # not a source regression; same source is green on every other leg).
      # Windows was not shipped historically; this restores that status quo.
      exclude_archs: 'windows_amd64;windows_amd64_mingw'

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.6
      ci_tools_version: v1.5-variegata
      extension_name: duck_block_utils
      format_checks: 'format;tidy'

  # THE PIN EQUALS THE REGISTRY DEFAULT, AND THE WORKFLOW SHIPS EVERY LINE THE
  # REGISTRY BUILDS. Fleet rule (Teague, 2026-09-13): the duckdb submodule is
  # pinned at exactly the commit of the tag the stable build ships against, which
  # is also the version the community registry builds every extension with, and
  # this workflow also ships the next line the registry builds (build_next.yml).
  # Otherwise local builds and each repo's own CI artifacts carry a different
  # DuckDB than the served one, and extensions built in different repos cannot
  # co-load locally (the ABI is exact-version). Measured 2026-09-13: five sibling
  # repos were on a July dev commit, one on a v1.5.6-dev commit, one on DuckDB
  # main. Nothing but a check keeps this true. The second assertion keeps this
  # job's constants from drifting away from the `duckdb_version:` the build jobs
  # above actually use.
  duckdb-pin:
    name: DuckDB submodule pin equals the shipped tag
    # Name kept as-is even though the rule is now two-sided:
    # required-check configuration may key on this job name.
    runs-on: ubuntu-latest
    env:
      # What this repo pins, ships, and tests against.
      DUCKDB_VERSION: v1.5.6
      # The next line this workflow builds, for compile-compat and for the
      # test-coverage leg. BRANCH name, not the registry's commit -- see
      # duckdb-v2-test-coverage below for why that distinction is load-bearing.
      DUCKDB_NEXT: v2.0-cyanoptera
      # What the community registry builds by default, as of #3079. Recorded so
      # that the registry moving again is a FAILURE here rather than a surprise
      # in a release. DUCKDB_REGISTRY_TAG is not an upstream tag: ci-tools tags
      # the commit with it locally so the built extension reports a version.
      DUCKDB_REGISTRY_COMMIT: b15358c371daf10dad799a43b6167f6ccdce84d8
      DUCKDB_REGISTRY_TAG: v2.0.0-alpha46057
      DUCKDB_REGISTRY_TOOLS: v2.0-cyanoptera
      # scripts/build.py routes a v1.5.6 build to each descriptor's `variegata`
      # ref, which is the line this repo still ships.
      DUCKDB_REGISTRY_VARIANT: v1.5.6
      # Flip day keeps a duckdb-legacy-build at the outgoing version for one
      # release; set this to that version then so the stray-literal scan exempts
      # it instead of flagging it. Empty the rest of the time.
      DUCKDB_LEGACY: ''
    steps:
      - uses: actions/checkout@v4
      - name: Compare the pin with its tag, and the recorded registry values with the registry
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # One variable, one edit point: every sibling repo copies this job
          # verbatim, and the greps and the stray-literal scans below all read
          # this same file.
          wf=.github/workflows/MainDistributionPipeline.yml
          want=$(git ls-remote --tags https://github.com/duckdb/duckdb "refs/tags/${DUCKDB_VERSION}^{}" | cut -f1)
          [ -n "$want" ] || want=$(git ls-remote --tags https://github.com/duckdb/duckdb "refs/tags/${DUCKDB_VERSION}" | cut -f1)
          have=$(git ls-tree HEAD duckdb | awk '{print $3}')
          echo "shipped tag ${DUCKDB_VERSION} -> ${want}"
          echo "submodule pin          -> ${have}"
          [ -n "$want" ] || { echo "::error::could not resolve tag ${DUCKDB_VERSION} upstream"; exit 1; }
          [ "$want" = "$have" ] || { echo "::error::duckdb submodule pin ${have} is not the ${DUCKDB_VERSION} tag ${want}; run: git -C duckdb fetch --tags && git -C duckdb checkout ${DUCKDB_VERSION}"; exit 1; }
          # The build jobs must actually use this job's constants.
          for want_line in "duckdb_version: ${DUCKDB_VERSION}" "duckdb_version: ${DUCKDB_NEXT}"; do
            c=$(grep -c "${want_line}$" "$wf" || true)
            [ "$c" -ge 1 ] || { echo "::error::no build job in this workflow uses ${want_line}; this job's constants have drifted"; exit 1; }
          done
          # NO OTHER DuckDB VERSION LITERAL may drift anywhere else in this file:
          # sibling workflows (yaml, mcp) embed a version in artifact NAMES and CLI
          # download URLs (e.g. `yaml-v1.5.4-extension-wasm_*`,
          # `releases/download/v1.5.4/duckdb_cli`) that the greps above cannot see, so
          # a bump left them stale and this job went green over a red build. Comment
          # lines (first non-space char `#`) are exempt, and so are `uses:` lines (a
          # `- uses:` list item too): a third-party action pin like `@v2.0.4` is not a
          # DuckDB version. Branch names like `v2.0-cyanoptera` and `v1.5-variegata`
          # have no third numeric component and so never match. The optional
          # pre-release suffix makes `v2.0.0-alpha46057` match whole rather than
          # reading as `v2.0.0`, while `v1.5.6-extension-wasm_eh` in an artifact name
          # still reads as `v1.5.6`. DUCKDB_LEGACY, when set, is exempt too.
          ver_re='v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc|dev)[0-9.]*)?'
          bad=0
          while IFS=: read -r lineno line; do
            printf '%s\n' "$line" | grep -qE '^[[:space:]]*#' && continue
            printf '%s\n' "$line" | grep -qE '^[[:space:]]*-?[[:space:]]*uses:' && continue
            for v in $(printf '%s\n' "$line" | grep -oE "$ver_re" || true); do
              [ "$v" = "$DUCKDB_VERSION" ] && continue
              [ "$v" = "$DUCKDB_REGISTRY_TAG" ] && continue
              [ -n "$DUCKDB_LEGACY" ] && [ "$v" = "$DUCKDB_LEGACY" ] && continue
              echo "::error::line ${lineno}: ${line} -- a DuckDB version literal that is not the shipped ${DUCKDB_VERSION} or the recorded registry tag ${DUCKDB_REGISTRY_TAG}: derive it from the shipped version or bump it"
              bad=1
            done
          done < <(grep -nE "$ver_re" "$wf" || true)
          # Any 40-hex literal outside comments, `uses:` pins and `vcpkg_commit:`
          # must be the recorded registry commit: a commit bump otherwise leaves a
          # stale sha that the version scan above cannot see.
          while IFS=: read -r lineno line; do
            printf '%s\n' "$line" | grep -qE '^[[:space:]]*#' && continue
            printf '%s\n' "$line" | grep -qE '^[[:space:]]*-?[[:space:]]*uses:' && continue
            printf '%s\n' "$line" | grep -qE '^[[:space:]]*vcpkg_commit:' && continue
            for h in $(printf '%s\n' "$line" | grep -oE '[0-9a-f]{40}' || true); do
              [ "$h" = "$DUCKDB_REGISTRY_COMMIT" ] && continue
              echo "::error::line ${lineno}: ${line} -- a commit literal that is not the recorded registry commit ${DUCKDB_REGISTRY_COMMIT}: derive it or bump it"
              bad=1
            done
          done < <(grep -nE '[0-9a-f]{40}' "$wf" || true)
          [ "$bad" -eq 0 ] || exit 1
          # THE AUTHORITY for the registry half is the registry's own files, not this
          # job's constants: a constant checked only against itself passes for a year
          # after the registry moves (panduck, 2026-09-13). Resolve main to a sha
          # first so the raw fetches are not served from the branch cache. THREE
          # degraded paths, deliberately different: UNREACHABLE (curl itself failed,
          # HTTP code 000) is the world being unavailable -> a NOTE, and the summary
          # says the registry assertions were not made; a non-2xx HTTP code (e.g. a
          # renamed/removed registry file) is this check asking a well-formed question
          # and being told no -> a FAILURE naming the code and URL (a bare `curl -sf`
          # would have mistaken this for UNREACHABLE and measured nothing);
          # REACHABLE, 2xx, BUT UNPARSEABLE is this check being wrong about the file's
          # content -> also a FAILURE.
          #
          # FOUR values are parsed, not one. The previous revision parsed only a
          # `'v<semver>'` default out of build.yml, so when #3079 replaced it with a
          # bare commit the parse returned empty and this job failed on the
          # UNPARSEABLE branch -- hiding the real change behind a parse error. The
          # registry's default has taken a tag, a 10-char abbreviated sha and a full
          # 40-char sha within four commits, so each value is parsed in the shape the
          # registry actually writes it.
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          base="https://raw.githubusercontent.com/duckdb/community-extensions"
          # An Authorization: Bearer header with an EMPTY token is not "no header":
          # GitHub answers 401 to it, worse than sending no header at all. An
          # unauthenticated local run would then always miss sha resolution and fall
          # back to the `main` REF NAME, comparing against whatever the branch URL's
          # cache happens to be serving -- the exact staleness this step avoids. So
          # the header is added only when a token is actually present; CI always has one.
          auth=(); [ -n "${GITHUB_TOKEN:-}" ] && auth=(-H "Authorization: Bearer ${GITHUB_TOKEN}")
          sha=$(curl -sf "${auth[@]}" https://api.github.com/repos/duckdb/community-extensions/commits/main | grep -m1 -o '"sha": *"[0-9a-f]*"' | grep -o '[0-9a-f]\{40\}' || true)
          url1="${base}/${sha:-main}/.github/workflows/build.yml"
          url2="${base}/${sha:-main}/scripts/build.py"
          f1=$(mktemp); f2=$(mktemp)
          # curl writes 000 to %{http_code} when no HTTP response arrived at all;
          # `|| true` only stops `set -e` from killing the script, leaving curl's
          # own "000" unaltered (a `|| echo 000` would double it to "000000").
          code1=$(curl -s -o "$f1" -w '%{http_code}' "$url1" || true)
          code2=$(curl -s -o "$f2" -w '%{http_code}' "$url2" || true)
          if [ "$code1" = "000" ] || [ "$code2" = "000" ]; then
            echo "::notice::could not reach the community registry; only the local assertions were made"
            mode="NOT checked against the registry (unreachable); local constants only"
          elif [ "${code1#2}" = "$code1" ]; then
            echo "::error::community registry returned HTTP ${code1} for ${url1}"
            echo "duckdb-pin: FAILED, registry returned ${code1} for ${url1}" >> "$summary"; exit 1
          elif [ "${code2#2}" = "$code2" ]; then
            echo "::error::community registry returned HTTP ${code2} for ${url2}"
            echo "duckdb-pin: FAILED, registry returned ${code2} for ${url2}" >> "$summary"; exit 1
          else
            reg_commit=$(grep -m1 -o "inputs.duckdb_version || '[0-9a-f]\{40\}'" "$f1" | grep -o '[0-9a-f]\{40\}' || true)
            reg_tag=$(grep -m1 -o "inputs.duckdb_tag || 'v[^']*'" "$f1" | grep -o "'v[^']*'" | tr -d "'" || true)
            reg_tools=$(grep -m1 -o "inputs.ci_tools_version || '[^']*'" "$f1" | grep -o "'[^']*'$" | tr -d "'" || true)
            # build.py routes one DUCKDB_VERSION to each descriptor's `variegata`
            # ref; the version sits in the condition on the line before.
            reg_variant=$(grep -B1 "'variegata' in desc" "$f2" | grep -m1 -o "== 'v[0-9.]*'" | grep -o "v[0-9.]*" || true)
            if [ -z "$reg_commit" ] || [ -z "$reg_tag" ] || [ -z "$reg_tools" ] || [ -z "$reg_variant" ]; then
              echo "::error::community-extensions at ${sha:-main} was fetched but build.yml/build.py carry no recognisable defaults (commit='${reg_commit}', tag='${reg_tag}', ci-tools='${reg_tools}', variant='${reg_variant}'); this check's parse is wrong about the registry, fix the check"
              echo "duckdb-pin: FAILED, registry files fetched but unparseable" >> "$summary"; exit 1
            fi
            registry="${reg_commit}/${reg_tag}/${reg_tools}/${reg_variant}"
            recorded="${DUCKDB_REGISTRY_COMMIT}/${DUCKDB_REGISTRY_TAG}/${DUCKDB_REGISTRY_TOOLS}/${DUCKDB_REGISTRY_VARIANT}"
            if [ "$registry" != "$recorded" ]; then
              echo "::error::the community registry now builds commit/tag/ci-tools/variant ${registry} (at ${sha:-main}) but this workflow records ${recorded}; update the DUCKDB_REGISTRY_* constants, and re-read the DIVERGENCE note at the top of this job -- the registry has moved again"
              echo "duckdb-pin: FAILED, registry ${registry} vs recorded ${recorded}" >> "$summary"; exit 1
            fi
            # The divergence this repo knowingly carries, restated every run so it
            # cannot become invisible: we pin and ship ${DUCKDB_VERSION} while the
            # registry's default build target is ${reg_commit:0:10} (${reg_tag}).
            mode="registry verified at ${sha:-main}: default ${reg_commit:0:10} ${reg_tag} on ${reg_tools}, variant ${reg_variant}; THIS REPO SHIPS ${DUCKDB_VERSION} (declared divergence; see the note in this job)"
          fi
          echo "duckdb-pin: OK, pin ${have:0:10} == ${DUCKDB_VERSION}; jobs ship ${DUCKDB_VERSION} and ${DUCKDB_NEXT}; ${mode}" | tee -a "$summary"

  vocabulary-header:
    name: Vocabulary header is freestanding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Header must compile and link with no DuckDB present
        env:
          DUCK_BLOCK_CHECKS_STRICT: '1'
        run: python3 test/check_vocabulary_header.py

  # THE HEADER AND THE CONFORMANCE MACROS ARE TWO ENCODINGS OF ONE VOCABULARY, and
  # until now nothing in CI compared them. They disagreed for three releases:
  # TYPE_DOCUMENT landed in the header with the 1.4 amendment of 2026-09-16 and was
  # never added to duck_block_declared_types(), so a producer emitting the document
  # root the spec had just legalised was reported as using an undeclared name. A
  # CONSUMER found it (duckdb_markdown, while re-vendoring), which is the wrong way
  # round for a defect in two files that both live here.
  #
  # check_conformance_macro.py is the better comparison -- it runs the real extension
  # against the real macros, so it sees RULE divergence and not just missing names --
  # but it needs a built extension and is one of the guards #58 reports as unrun. This
  # one needs no build, no network and no DuckDB: two text files and a set comparison.
  # There is no reason for it not to run on every push, which is the whole argument.
  #
  # BOTH ANSWERS PINNED before wiring it: --self-test mutates the pair in memory three
  # ways (a dropped name, an invented name, a truncated scrape) and requires all three
  # to be detected; and the guard was run against the PRE-FIX macros, where it reports
  # the real historical 'document' gap and exits 1. A detector exercised only on the
  # passing side is half-checked.
  conformance-types:
    name: Header and conformance macros declare the same names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: The guard can fail
        run: python3 test/check_conformance_types.py --self-test
      - name: Header and macros agree
        run: python3 test/check_conformance_types.py
